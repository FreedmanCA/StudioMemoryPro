<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <title>StudioMemory | Watch</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <style>
        :root {
            --apple-blue: #0071e3;
            --text-main: #1d1d1f;
            --text-secondary: #424245;
            --bg-light: #f5f5f7;
            --border-color: #d2d2d7;
            --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            color: var(--text-main);
            background-color: #ffffff;
            line-height: 1.47059;
            font-weight: 400;
            letter-spacing: -0.022em;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        main {
            overflow-x: hidden;
            min-height: calc(100vh - 48px - 120px); /* Keeps footer layout proportional */
        }

        /* Navigation Bar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10%;
            height: 48px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 19px;
            transition: opacity 0.2s ease;
        }
        .logo-container:hover { opacity: 0.7; }

        .logo-img {
            width: 32px;
            height: 32px;
            border-radius: 7px; 
            object-fit: cover;
        }

        /* Desktop Navigation Links */
        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 500;
            opacity: 0.6; /* Mutes inactive links */
            transition: opacity 0.2s ease;
        }
        
        /* Light up links to full brightness on hover or if it is the current page */
        .nav-links a:hover,
        .nav-links a.current {
            opacity: 1;
        }

        /* Hamburger Menu Toggle Button */
        .menu-toggle {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 22px;
            height: 16px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            z-index: 1001;
        }

        .hamburger-bar {
            width: 100%;
            height: 2px;
            background-color: var(--text-main);
            transition: transform 0.25s ease, opacity 0.25s ease;
            transform-origin: left center;
        }

        /* Video Placeholder Section */
        .video-section {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 20px;
            text-align: center;
        }

        .video-section h1 {
            font-size: clamp(28px, 5vw, 40px);
            font-weight: 700;
            letter-spacing: -0.003em;
            margin-bottom: 10px;
        }

        .video-section p {
            font-size: clamp(16px, 2vw, 19px);
            color: var(--text-secondary);
            margin-bottom: 40px;
        }

        .video-placeholder {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: var(--bg-light);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 30px;
        }

        /* Footer */
        footer {
            padding: 40px 10%;
            text-align: center;
            background-color: #fafafa;
            border-top: 1px solid #f0f0f0;
        }

        .footer-nav {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .footer-nav a {
            text-decoration: none;
            color: var(--text-main);
            font-size: 12px;
            opacity: 0.6; /* Mutes footer links by default */
            transition: opacity 0.2s ease;
        }
        .footer-nav a:hover {
            opacity: 1; /* Lights up to full brightness on hover */
        }

        /* Mobile Responsive Navigation Overlay */
        @media (max-width: 768px) {
            .menu-toggle {
                display: flex;
            }

            .nav-links {
                display: flex;
                flex-direction: column;
                gap: 0;
                position: fixed;
                top: 48px;
                left: 0;
                width: 100%;
                height: 0;
                background-color: #ffffff;
                opacity: 0;
                visibility: hidden;
                overflow: hidden;
                transition: height 0.3s ease, opacity 0.3s ease, visibility 0.3s ease;
            }

            .nav-links a {
                width: 100%;
                padding: 20px 10%;
                font-size: 18px;
                font-weight: 500;
                border-bottom: 1px solid rgba(0, 0, 0, 0.05);
                box-sizing: border-box;
            }

            .nav-links.active {
                height: calc(100vh - 48px);
                opacity: 1;
                visibility: visible;
            }

            /* Morph bars into an 'X' symbol */
            .menu-toggle.open .hamburger-bar:nth-child(1) {
                transform: rotate(45deg) translate(1px, -1px);
            }
            .menu-toggle.open .hamburger-bar:nth-child(2) {
                opacity: 0;
                transform: scaleX(0);
            }
            .menu-toggle.open .hamburger-bar:nth-child(3) {
                transform: rotate(-45deg) translate(1px, 1px);
            }

            .footer-nav {
                flex-direction: column;
                gap: 15px;
            }
        }

        /* Native Dark Mode Settings */
        @media (prefers-color-scheme: dark) {
            :root {
                --apple-blue: #2997ff;
                --text-main: #f5f5f7;
                --text-secondary: #a1a1a6;
                --bg-light: #1c1c1e;
                --border-color: #38383a;
            }

            body {
                background-color: #000000;
            }

            nav {
                background: rgba(0, 0, 0, 0.8);
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }

            footer {
                background-color: #000000;
                border-top: 1px solid #38383a;
            }
        }

        @media (prefers-color-scheme: dark) and (max-width: 768px) {
            .nav-links {
                background-color: #000000;
            }
            .nav-links a {
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo-container">
            <img src="logo.webp" alt="StudioMemory Logo" class="logo-img">
            StudioMemory
        </a>
        
        <button class="menu-toggle" id="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">
            <span class="hamburger-bar"></span>
            <span class="hamburger-bar"></span>
            <span class="hamburger-bar"></span>
        </button>

        <div class="nav-links" id="nav-links">
            <a href="about.html">About</a>
            <a href="manual.html">User Guide</a>
            <a href="faq.html">FAQ</a>
            <a href="pricing.html">Pricing</a>
            <a href="watch.html" class="current">Watch</a>
        </div>
    </nav>

    <main>
        <section class="video-section">
            <h1>StudioMemory in Action</h1>
            <p>Watch how easy it is to archive, organize, and manage your collection of works.</p>
            
            <div class="video-placeholder">
                Demonstration Video Placeholder
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-nav">
            <a href="privacy.html">Privacy Policy</a>
            <a href="mailto:support@studiomemorypro.com?subject=StudioMemory%20Pro%20Support%20Request">Contact Support</a>
        </div>
    </footer>

    <script src="nav.js"></script>
</body>
</html>
