    <style>
.mobile-copy-break {
    display: none;
}

@media (max-width: 768px) {
    .mobile-copy-break {
        display: block;
    }
}


        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            color: var(--text-main);
            background-color: #ffffff;
            line-height: 1.47059;
            font-weight: 400;
            letter-spacing: -0.022em;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            overflow-x: hidden;
            flex: 1;
        }

        /* Nav, hamburger menu, and mobile overlay are in shared.css */

        /* Video Placeholder Section */
        .video-section {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 20px;
            text-align: center;
        }

        .video-section h1 {
            font-size: clamp(28px, 5vw, 40px);
            font-weight: 700;
            letter-spacing: -0.003em;
            margin-bottom: 10px;
        }

        .video-section p {
            font-size: clamp(16px, 2vw, 19px);
            color: var(--text-secondary);
            margin-bottom: 40px;
        }

	.video-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
    max-width: 720px;
    margin: 0 auto;
    text-align: left;
}

@media (max-width: 768px) {
    .video-grid {
        grid-template-columns: repeat(3, 1fr);
        max-width: 360px;
    }
}

@media (max-width: 480px) {
    .video-grid {
        grid-template-columns: repeat(2, 1fr);
        max-width: 240px;
    }
}

        .video-card {
            appearance: none;
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 0;
            overflow: hidden;
            background: var(--bg-light);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .video-card:hover,
        .video-card:focus-visible {
            transform: translateY(-3px);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.16);
            outline: none;
        }

        .video-card img {
            display: block;
            width: 100%;
            aspect-ratio: 9 / 16;
            object-fit: cover;
            background: #000;
        }

        .video-modal {
            border: 0;
            padding: 24px;
            max-width: none;
            max-height: none;
            width: 100%;
            height: 100%;
            background: transparent;
            place-items: center;
        }

        .video-modal[open] {
            display: grid;
        }

        .video-modal::backdrop {
            background: rgba(0, 0, 0, 0.95);
        }

        .video-modal-content {
    position: relative;
    width: min(90vw, 420px);
    aspect-ratio: 9 / 16;
}

        .video-modal iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    border-radius: 16px;
    background: #000;
}

        .video-modal-close {
            position: absolute;
            top: -12px;
            right: -12px;
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 50%;
            background: #fff;
            color: #1d1d1f;
            font-size: 27px;
            line-height: 1;
            cursor: pointer;
        }
        
        /* Footer */
        footer {
            padding: 40px 10%;
            text-align: center;
            border-top: 1px solid #f0f0f0;
        }

        .footer-nav {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        /* .footer-nav a link styling is in shared.css */

        /* Mobile: page-specific footer-nav layout only (nav overlay is in shared.css) */
        @media (max-width: 768px) {
            .footer-nav {
                flex-direction: column;
                gap: 15px;
            }
        }

        /* Native Dark Mode Settings */
        /* Color variables and nav dark styling are in shared.css */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #000000;
            }

            footer {
                border-top: 1px solid #38383a;
            }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo-container">
            <img src="logo.webp" alt="StudioMemory Logo" class="logo-img">
            StudioMemory
        </a>
        
        <button class="menu-toggle" id="menu-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="nav-links">
            <span class="hamburger-bar"></span>
            <span class="hamburger-bar"></span>
            <span class="hamburger-bar"></span>
        </button>

        <div class="nav-links" id="nav-links">
            <a href="about.html">About</a>
            <a href="manual.html">User Guide</a>
            <a href="faq.html">FAQ</a>
            <a href="watch.html" class="current">Watch</a>
        </div>
    </nav>

    <main>
        <section class="video-section">
            <h1>StudioMemory in Action</h1>
            <p>Watch how easy it is to archive, organize,<br class="mobile-copy-break"> and manage your collection of works.</p>
            
<div class="video-grid">
    <button class="video-card"
        data-youtube="https://www.youtube-nocookie.com/embed/WWXs8VEtZlI"
        aria-label="Play One Collection">
    <img src="One-Collection-Poster.webp" alt="" loading="lazy">
</button>

    <button class="video-card"
        data-youtube="https://www.youtube-nocookie.com/embed/ftYROsVJH7c"
        aria-label="Play Privacy by Design">
    <img src="Privacy-by-Design-Poster.webp" alt="" loading="lazy">
</button>

<button class="video-card"
        data-youtube="https://www.youtube-nocookie.com/embed/HP7m9yBC-rI"
        aria-label="Play Chaos to Catalog">
    <img src="Chaos-to-Catalog.webp" alt="" loading="lazy">
</button>

    <button class="video-card"
        data-youtube="https://www.youtube-nocookie.com/embed/aR-FcyzOHKc" 
        aria-label="Play Six Frames">
    <img src="Six-Frames-Poster.webp" alt="" loading="lazy">
</button>

    <button class="video-card"
        data-youtube="https://www.youtube-nocookie.com/embed/bkDSpCg-zd4"
        aria-label="Play PDF Portfolios">
    <img src="PDF-Portfolios-Poster.webp" alt="" loading="lazy">
</button>

    <button class="video-card"
        data-youtube="https://www.youtube-nocookie.com/embed/iSNsPXtqhGc"
        aria-label="Play QuickDetails">
    <img src="QuickDetails-Poster.webp" alt="" loading="lazy">
</button>
</div>
        </section>
    </main>

    <footer>
        <div class="footer-nav">
            <a href="privacy.html">Privacy Policy</a>
            <a href="mailto:support@studiomemoryapp.com?subject=StudioMemory%20Support%20Request">Contact Support</a>
        </div>
    </footer>

    <dialog class="video-modal" id="video-modal" aria-label="Video player">
        <div class="video-modal-content">
            <button class="video-modal-close" id="video-modal-close" aria-label="Close video">&times;</button>
            <iframe
                id="modal-video"
                src=""
                title="StudioMemory Video"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>
        </div>
    </dialog>

    <script>
        const modal = document.getElementById('video-modal');
        const modalVideo = document.getElementById('modal-video');
        const closeModal = document.getElementById('video-modal-close');

        if (modal && modalVideo && closeModal) {

            document.querySelectorAll('.video-card').forEach((card) => {
                card.addEventListener('click', () => {
                    try {
                        modalVideo.src =
                            card.dataset.youtube +
                            "?autoplay=1&rel=0&modestbranding=1";
                        modal.showModal();
                        document.body.classList.add('scroll-locked');
                    } catch (err) {
                        console.error('Failed to open video modal:', err);
                        document.body.classList.remove('scroll-locked');
                    }
                });
            });

            closeModal.addEventListener('click', () => modal.close());

            modal.addEventListener('click', (event) => {
                if (event.target === modal) modal.close();
            });

            modal.addEventListener('close', () => {
                modalVideo.src = "";
                document.body.classList.remove('scroll-locked');
            });

        }

        </script>


    <script src="nav.js"></script>
</body>
</html>
